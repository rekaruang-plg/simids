name: Extract SiMIDS source

on:
  push:
    branches: [main]
    paths:
      - source.zip

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract prototype files
        shell: bash
        run: |
          rm -rf .extract
          mkdir -p .extract
          unzip -o source.zip -d .extract
          cp -a .extract/simids_tanjung_lago_v5/. ./
          rm -rf .extract

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css manifest.json sw.js database_schema.sql FUNGSI_PROPOSAL_VS_SISTEM.md UX_CHANGELOG_V5.md README.md
          if ! git diff --cached --quiet; then
            git commit -m "Extract SiMIDS V5 source"
            git push
          fi
